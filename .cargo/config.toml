[alias]
xtask = "run --package xtask --"

[target.thumbv7em-none-eabihf]
runner = ["probe-rs", "run", "--chip", "STM32F439ZITx", "--log-format=oneline"]
rustflags = [
  "-C", "linker=flip-link",
  "-C", "link-arg=--nmagic",
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=-Tdefmt.x",
]

[env]
DEFMT_LOG = "info"
