[workspace]
resolver = "3"
members = ["bootloader", "app"]
default-members = ["bootloader", "app"]

[workspace.package]
authors = ["xin"]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "1.0"
defmt-rtt = "1.0"
defmt-test = "0.3"
panic-probe = { version = "1.0", features = ["print-defmt"] }
semihosting = "0.1.20"
stm32f4xx-hal = { version = "0.23", features = ["stm32f439"] }

# cargo build/run
[profile.dev]
# opt-level = 0 produces very verbose embedded machine code.
opt-level = "s"
codegen-units = 1

# cargo build/run --release
[profile.release]
opt-level = "s"
codegen-units = 1
lto = "fat"
debug = 2
