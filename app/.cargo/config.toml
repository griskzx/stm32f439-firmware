[target.'cfg(all(target_arch = "arm", target_os = "none"))']
runner = ["probe-rs", "run", "--chip", "STM32F439ZI", "--log-format=oneline"]

rustflags = [
  "-C", "linker=flip-link",
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=-Tdefmt.x",
  "-C", "link-arg=--nmagic",
]

[env]
# Compile-time defmt filter. Applies to app, boot, and all bins.
# debug includes debug/info/warn/error, not trace.
# Override per-invocation: DEFMT_LOG=trace cargo run -p app --bin app
DEFMT_LOG = "debug"

[build]
target = "thumbv7em-none-eabihf"

[alias]
rb = "run --bin"
rrb = "run --release --bin"
