[package]
name = "app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "app"
test = false
bench = false

[dependencies]
embassy-stm32 = { version = "0.6.0", features = ["defmt", "stm32f439zi", "time-driver-tim4"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
