[package]
name = "app"
version = "0.1.0"
edition = "2024"

[lib]
test = false
doctest = false
bench = false

[[bin]]
name = "app"
path = "src/bin/app.rs"
test = false
bench = false


[dependencies]
embassy-stm32 = { version = "*", features = ["defmt", "time-driver-any", "stm32f439zi", "unstable-pac", "exti", "dual-bank"] }
embassy-sync = {version="*", features = ["defmt"] }
embassy-executor = {version="*",  features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = {version="*",features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-futures = "*"

defmt = "1.0.1"
defmt-rtt = "1.0.0"

cortex-m = { version = "0.7.6", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
