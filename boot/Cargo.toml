[package]
name = "boot"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
harness = false

[[bin]]
name = "boot"
test = false
bench = false


# needed for each integration test
[[test]]
name = "integration"
harness = false

[dependencies]
stm32f4xx-hal = { version = "0.23.0", features = ["stm32f439"] }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
semihosting = "0.1.20"

[dev-dependencies]
defmt-test = "0.3"
