[package]
name = "bootloader"
authors.workspace = true
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false
build = "build.rs"

# Binary tests are disabled so `cargo test` only builds the explicit test
# targets on the embedded device.
[[bin]]
name = "bitfield"
path = "src/bin/bitfield.rs"
test = false

[[bin]]
name = "format"
path = "src/bin/format.rs"
test = false

[[bin]]
name = "hello"
path = "src/bin/hello.rs"
test = false

[[bin]]
name = "ccmram"
path = "src/bin/ccmram.rs"
test = false

[[bin]]
name = "levels"
path = "src/bin/levels.rs"
test = false

[[bin]]
name = "overflow"
path = "src/bin/overflow.rs"
test = false

[[bin]]
name = "panic"
path = "src/bin/panic.rs"
test = false

[[bin]]
name = "simple_jump"
path="src/bin/simple_jump.rs"
test = false

[lib]
harness = false

[[test]]
name = "integration"
harness = false

[dependencies]
cortex-m.workspace = true
cortex-m-rt.workspace = true
defmt.workspace = true
defmt-rtt.workspace = true
panic-probe.workspace = true
semihosting.workspace = true
stm32f4xx-hal.workspace = true

[dev-dependencies]
defmt-test.workspace = true
